on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: I-checkout ang code
        uses: actions/checkout@v4

      - name: I-build gamit ang buildozer-action (pre-configured na environment)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: I-upload ang APK bilang artifact (para ma-download mo)
        uses: actions/upload-artifact@v4
        with:
          name: burgman-esp32-apk
          path: ${{ steps.buildozer.outputs.filename }}
