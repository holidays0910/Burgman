    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            unzip \
            ant \
            autoconf \
            libtool \
            libltdl-dev \
            pkg-config \
            libncurses5-dev \
            libncursesw5-dev \
            libstdc++6 \
            libglu1-mesa-dev \
            openjdk-17-jdk
