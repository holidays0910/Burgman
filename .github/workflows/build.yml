# Build APK using Buildozer on Ubuntu runner and upload APK as artifact
# Inilalagay dito ang mga hakbang para mag-install ng Android SDK/NDK at gumawa ng debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: I-checkout ang code
        uses: actions/checkout@v4

      - name: I-setup ang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: I-install ang system packages
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev \
            build-essential python3-pip python3-venv

      - name: Ihanda ang Android SDK directories
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          mkdir -p $ANDROID_SDK_ROOT/licenses

      - name: I-download ang Android commandline-tools
        run: |
          cd $ANDROID_SDK_ROOT
          # Download latest commandline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          # Layout expected by sdkmanager
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true

      - name: I-install ang Android SDK packages (platform-tools, platforms, build-tools, NDK)
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true

      - name: I-update ang pip at i-install ang Buildozer at Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython==0.29.36

      - name: Ipakita ang Buildozer version at environment
        run: |
          buildozer --version
          python3 -c "import sys,platform; print(sys.version, platform.system())"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: I-build ang APK (debug) gamit ang Buildozer
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          # Patakbuhin sa non-interactive mode
          buildozer -v android debug

      - name: I-upload ang APK bilang artifact (para ma-download mo)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: burgman-apk
          path: bin/*.apk
